CONFIG_OPENTHREAD_SOURCES=y

# Enable Alternate PHY (HDR) capability advertisement and discovery via MLE.
CONFIG_OPENTHREAD_ALTERNATE_PHY=y

# Advertise the TL3 2 Mbps GFSK Alternate PHY (PHY ID 0) with the default timing.
CONFIG_OPENTHREAD_ALTERNATE_PHY_GFSK=y
CONFIG_OPENTHREAD_ALTERNATE_PHY_SETTLING_DELAY=192
CONFIG_OPENTHREAD_ALTERNATE_PHY_AIFS=192
CONFIG_OPENTHREAD_ALTERNATE_PHY_MAX_PSDU=255
CONFIG_OPENTHREAD_ALTERNATE_PHY_CONCURRENT_LISTENING=n

# Build the radio driver from the standalone nrf-802154 repository.
CONFIG_NRF_802154_SOURCE_INTERNAL=y
