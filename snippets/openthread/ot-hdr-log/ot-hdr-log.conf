# Debug logging for the Alternate PHY (HDR) and DAPS exchange. Combine with the ot-hdr snippet:
#   -DSNIPPET="ot-hdr;ot-hdr-log"

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Keep debug messages compiled in even when combined with a snippet that lowers this, e.g.
# ot-logging.
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=65536
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# The OpenThread platform log level, and with it the HDR messages, follows the stack log level.
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_DEBG=y

# Allows narrowing the output at runtime, e.g. `log disable` then
# `log enable dbg otPlat_nrf5_radio`.
CONFIG_LOG_RUNTIME_FILTERING=y
